<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>हिंदी महीना ब्याज 1433</title>
<style>
body { font-family: Arial; background: #f0f8ff; padding: 10px; }
.box { background: #fff; padding: 15px; border-radius: 10px; max-width: 500px; margin: auto; }
.header { background: linear-gradient(90deg, #FF9933, #fff, #138808); padding: 8px; text-align: center; border-radius: 8px; margin-bottom: 10px; }
.header h1 { font-size: 16px; margin: 0; color: #000080; }
.r2 { display:flex; gap:5px; }
input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
.btn { width: 100%; padding: 12px; background: #004080; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; }
.result { background: #e6ffe6; padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 4px solid #28a745; }
.green { color: #28a745; font-weight: bold; font-size: 18px; }
.orange { color: #ff6600; font-weight: bold; }
.red { color: #dc3545; font-weight: bold; }
.purple { color: #800080; font-weight: bold; }
table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 12px; }
th { background: #004080; color: #fff; padding: 5px; }
td { padding: 5px; text-align: center; border: 1px solid #ddd; }
</style>
</head>
<body>

<div class="box">
  <div class="header">
    <h1>🇮🇳 Vyapar Bandhu हिंदी साल 1433 हिसाब 🇮🇳</h1>
  </div>
  <h2 style="text-align:center; color:#004080;">महीने से हिसाब + 1 साल बाद चक्रवृद्धि</h2>

  <label>मूलधन ₹</label>
  <input id="p" type="number" value="10000">

  <label>ब्याज दर % सालाना</label>
  <input id="r" type="number" step="0.1" value="36">

  <label>शुरू की तारीख - हिंदी</label>
  <div class="r2">
    <input id="sDin" type="number" value="1" min="1" max="15">
    <select id="sPaksh"><option value="sudi">सुदी</option><option value="badi">बदी</option></select>
    <select id="sMahina">
      <option>चैत्र</option><option>बैसाख</option><option>जेठ</option><option>आषाढ़</option>
      <option selected>सावन</option><option>भादो</option><option>क्वार</option><option>कार्तिक</option>
      <option>अगहन</option><option>पूस</option><option>माघ</option><option>फागुन</option>
    </select>
    <input id="sSal" type="number" value="1433">
  </div>

  <label>अंत की तारीख - हिंदी</label>
  <div class="r2">
    <input id="eDin" type="number" value="1" min="1" max="15">
    <select id="ePaksh"><option value="sudi">सुदी</option><option selected value="badi">बदी</option></select>
    <select id="eMahina">
      <option>चैत्र</option><option>बैसाख</option><option>जेठ</option><option>आषाढ़</option>
      <option>सावन</option><option>भादो</option><option>क्वार</option><option>कार्तिक</option>
      <option selected>अगहन</option><option>पूस</option><option>माघ</option><option>फागुन</option>
    </select>
    <input id="eSal" type="number" value="1433">
  </div>

  <button class="btn" onclick="calc()">हिसाब लगाओ</button>

  <div id="output"></div>
</div>

<script>
const mahinaList = ["चैत्र","बैसाख","जेठ","आषाढ़","सावन","भादो","क्वार","कार्तिक","अगहन","पूस","माघ","फागुन"];

// हर 3 साल में अधिक महीना। 1433, 1436, 1439... 
function isAdhikVarsh(sal){
  return (sal - 1433) % 3 === 0; 
}

function hindiDateToMonths(din, paksh, mahina, sal){
  let totalMonths = 0;
  for(let y = 1433; y < sal; y++){
    totalMonths += 12;
    if(isAdhikVarsh(y)) totalMonths += 1; // अधिक महीना
  }
  
  let mahinaIndex = mahinaList.indexOf(mahina);
  totalMonths += mahinaIndex;
  
  if(isAdhikVarsh(sal) && mahinaIndex >= mahinaList.indexOf("सावन")) {
    totalMonths += 1; // अधिक सावन
  }
  
  // आधा महीना: सुदी = 0, बदी = 0.5
  let halfMonth = (paksh === 'badi') ? 0.5 : 0;
  let dinPart = (parseInt(din)-1)/15; // 1-15 के बीच
  
  return totalMonths + halfMonth + dinPart;
}

function calc(){
  let P = parseFloat(p.value);
  let R = parseFloat(r.value);
  
  let startMonths = hindiDateToMonths(sDin.value, sPaksh.value, sMahina.value, sSal.value);
  let endMonths = hindiDateToMonths(eDin.value, ePaksh.value, eMahina.value, eSal.value);
  let totalMonths = endMonths - startMonths;

  if(totalMonths < 0){ alert("अंत की तारीख गलत है"); return; }

  let currentP = P;
  let totalCI = 0;
  let adhikCount = 0;
  let table = `<table><tr><th>साल</th><th>प्रकार</th><th>महीना</th><th>शुरू रकम</th><th>ब्याज</th><th>कुल रकम</th></tr>`;

  // 1. PEHLA SAAL = SADHARAN BYAJ - 12 mahina
  if(totalMonths >= 12){
    let interest1 = P * (R/100) * 1; // 1 saal
    let after1Year = P + interest1;
    table += `<tr><td>1</td><td class="red">साधारण</td><td>12</td><td>₹${P.toFixed(0)}</td><td>₹${interest1.toFixed(2)}</td><td>₹${after1Year.toFixed(2)}</td></tr>`;
    currentP = after1Year;
    totalCI += interest1;
    totalMonths -= 12;
  } else {
    // 1 saal se kam - MAHINE SE HISAB
    let interest = P * (R/100) * (totalMonths/12);
    table += `<tr><td>1</td><td class="red">साधारण</td><td>${totalMonths.toFixed(1)}</td><td>₹${P.toFixed(0)}</td><td>₹${interest.toFixed(2)}</td><td>₹${(P+interest).toFixed(2)}</td></tr>`;
    output.innerHTML = `<div class="result"><h3>कुल महीना: ${totalMonths.toFixed(1)}</h3><h3>कुल ब्याज: <span class="orange">₹${interest.toFixed(2)}</span></h3><h3>कुल रकम: <span class="green">₹${(P+interest).toFixed(2)}</span></h3></div>${table}</table>`;
    return;
  }

  // 2. 1 SAAL KE BAAD = CHAKRAVIRDHI
  let yearCount = 2;
  let tempP = currentP;

  while(totalMonths > 0){
    let monthsThisYear = totalMonths >= 12 ? 12 : totalMonths;
    let currentSal = sSal.value + yearCount - 1;
    
    if(isAdhikVarsh(currentSal)) {
      monthsThisYear = totalMonths >= 13 ? 13 : totalMonths;
      if(monthsThisYear == 13) adhikCount++;
    }
    
    let interest = tempP * (R/100) * (monthsThisYear/12);
    tempP = tempP + interest;
    totalCI += interest;
    
    let type = isAdhikVarsh(currentSal) ? `<span class="purple">चक्रवृद्धि+अधिक</span>` : `<span class="green">चक्रवृद्धि</span>`;
    table += `<tr><td>${yearCount}</td><td>${type}</td><td>${monthsThisYear}</td><td>₹${(tempP-interest).toFixed(0)}</td><td>₹${interest.toFixed(2)}</td><td>₹${tempP.toFixed(2)}</td></tr>`;
    
    totalMonths -= monthsThisYear;
    yearCount++;
  }
  table += `</table>`;

  output.innerHTML = `
    <div class="result">
      <p><b>कुल महीना:</b> ${(endMonths - startMonths).toFixed(1)} महीने</p>
      <p><b>तारीख:</b> ${sDin.value} ${sPaksh.value=='sudi'?'सुदी':'बदी'} ${sMahina.value} ${sSal.value} से ${eDin.value} ${ePaksh.value=='sudi'?'सुदी':'बदी'} ${eMahina.value} ${eSal.value}</p>
      ${adhikCount > 0 ? `<p class="purple"><b>नोट:</b> इस बीच ${adhikCount} अधिक महीना आया</p>` : ''}
      <h3>कुल ब्याज: <span class="orange">₹${totalCI.toFixed(2)}</span></h3>
      <h3>कुल रकम: <span class="green">₹${tempP.toFixed(2)}</span></h3>
    </div>
    ${table}
  `;
}
calc();
</script>
</body>
</html>
